# KwikPaste 官方同步服务（容器 kwikpaste-sync，172.17.0.1:8686）。和 FT2 无关，单独一个文件。
server {
    listen 80;
    listen [::]:80;
    server_name sync.fastthree.com;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sync.fastthree.com;

    ssl_certificate     /etc/nginx/certs/sync.fastthree.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/sync.fastthree.com/privkey.pem;

    # 上传按帧流式读，事件流是长连接：不缓冲、读超时要长于服务端 240 秒一次的 ping。
    client_max_body_size 8m;

    location / {
        proxy_pass http://172.17.0.1:8686;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
